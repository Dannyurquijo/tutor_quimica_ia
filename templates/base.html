<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta content='width=device-width, initial-scale=1.0' name='viewport'/>
<link href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap' rel='stylesheet'/>
<link href='https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0' rel='stylesheet'/>
<style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style>
<script src='https://cdn.tailwindcss.com'></script>
<script id='tailwind-config'>tailwind.config={darkMode:'class',theme:{extend:{colors:{'surface':'#f8f9ff','on-primary-container':'#fffeff','surface-container-highest':'#dce3ee','on-tertiary-fixed-variant':'#004f53','on-primary-fixed-variant':'#93000b','secondary-fixed':'#ffdad6','on-primary-fixed':'#410002','inverse-primary':'#ffb4ab','error':'#ba1a1a','surface-container-high':'#e2e9f4','on-secondary-fixed-variant':'#881e1d','tertiary-fixed-dim':'#64d7de','secondary-container':'#ff766d','surface-container':'#e8eefa','background':'#f8f9ff','on-secondary-container':'#720c0f','tertiary-container':'#008389','inverse-surface':'#2a313a','tertiary-fixed':'#83f4fb','primary-fixed-dim':'#ffb4ab','on-secondary':'#ffffff','surface-container-low':'#eef4ff','on-background':'#151c24','tertiary':'#00686d','on-secondary-fixed':'#410003','secondary-fixed-dim':'#ffb3ac','primary-fixed':'#ffdad6','on-error-container':'#93000a','primary':'#bb0c15','primary-container':'#e02e2b','on-tertiary-fixed':'#002022','outline-variant':'#e5bdb8','outline':'#916f6b','on-error':'#ffffff','surface-container-lowest':'#ffffff','surface-variant':'#dce3ee','inverse-on-surface':'#eaf1fd','surface-bright':'#f8f9ff','error-container':'#ffdad6','on-tertiary-container':'#feffff','on-surface':'#151c24','on-tertiary':'#ffffff','surface-tint':'#bd0e16','secondary':'#a83632','surface-dim':'#d4dae6','on-primary':'#ffffff','on-surface-variant':'#5c403c'},borderRadius:{'DEFAULT':'0.25rem','lg':'0.5rem','xl':'0.75rem','full':'9999px'},spacing:{'space-xl':'2rem','space-3xl':'3.5rem','space-2xs':'0.25rem','space-lg':'1.5rem','space-2xl':'2.5rem','layout-margin-desktop':'2rem','layout-margin-mobile':'1rem','space-md':'1rem','gutter-mobile':'0.75rem','space-xs':'0.5rem','tutor-panel-width':'24rem','space-sm':'0.75rem','gutter-desktop':'1.5rem','sidebar-width':'17.5rem'}}}</script>
</head>
<body class='bg-background font-body-md text-on-surface antialiased'>
{% block sidebar %}{% endblock %}
<div class='pl-sidebar-width'>
{% block header %}{% endblock %}
<main class='w-full pt-16 bg-surface-container-low/40 min-h-screen'>
{% block content %}{% endblock %}
</main>
<footer class='bg-surface-container-highest py-6 mt-10 text-center border-t border-surface-container'>
    <div class='flex justify-center gap-4 mb-4'>
        <a href='/onboarding' class='text-on-surface-variant hover:text-primary transition-colors font-label-md'>Inicio</a>
        <a href='/privacy' class='text-on-surface-variant hover:text-primary transition-colors font-label-md'>Aviso de Privacidad</a>
        <a href='/legal' class='text-on-surface-variant hover:text-primary transition-colors font-label-md'>Aviso Legal</a>
    </div>
    <div class='flex justify-center gap-4 mb-4'>
        <a href='#' class='text-on-surface-variant hover:text-primary'>Facebook</a>
        <a href='#' class='text-on-surface-variant hover:text-primary'>Instagram</a>
    </div>
    <p class='font-body-sm text-on-surface-variant'>&copy; 2026 Tutor Socrático IA - Preparatoria Balmoral.</p>
</footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
